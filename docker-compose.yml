version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mern-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./server
    container_name: mern-backend-compose
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cloud-lab
    depends_on:
      - mongodb

  frontend:
    build: ./client
    container_name: mern-frontend-compose
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mongo-data: